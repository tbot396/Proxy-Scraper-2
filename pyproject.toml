[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "proxyscraper"
version = "2.0.0"
description = "Modular proxy harvesting, validation, classification, and rotation tool"
requires-python = ">=3.11"
dependencies = [
    "httpx[socks]>=0.27",
    "python-socks>=2.4",
    "selectolax>=0.3",
    "geoip2>=4.8",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "black>=24.0", "respx>=0.21"]

[project.scripts]
proxyscraper = "proxyscraper.cli:main"

[tool.setuptools.packages.find]
include = ["proxyscraper*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
